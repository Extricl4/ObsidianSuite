# Builds ORPHEUS (the SIREN synth + ORPHEUS chord lines) for Windows on every push to the "orpheus" branch:
# the VST3 instrument and the standalone app, after the offline engine test passes.
# Download them from the run's "Artifacts" box (Actions tab). Nothing is published as a release, and
# the Obsidian app's own builds (plugin.yml, on main) are not touched.
name: ORPHEUS (Windows)

on:
  push:
    branches: [ orpheus ]
    paths: [ 'orpheus/**', '.github/workflows/orpheus.yml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: WebView2 SDK (for the window)
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.1901.177 -OutputDirectory "$env:RUNNER_TEMP\nuget" -NonInteractive

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: orpheus-deps-${{ runner.os }}-${{ hashFiles('orpheus/CMakeLists.txt') }}

      - name: Configure
        shell: pwsh
        run: |
          cmake -S orpheus -B build -A x64 -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$env:RUNNER_TEMP\nuget" *>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { ./plugin/tools/ci-report.ps1 configure.log; exit 1 }

      - name: Build VST3 + app + test
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel --target Orpheus_VST3 Orpheus_Standalone OrpheusTest -- /v:minimal /clp:ErrorsOnly *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { ./plugin/tools/ci-report.ps1 build.log; exit 1 }

      - name: Engine test
        shell: pwsh
        run: |
          & "build\OrpheusTest_artefacts\Release\OrpheusTest.exe" test-out orpheus\Tests\presets.json *>&1 | Tee-Object -FilePath test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { ./plugin/tools/ci-report.ps1 test.log; exit 1 }

      - name: Package
        shell: pwsh
        run: |
          $v = (Get-Content orpheus\VERSION).Trim()
          New-Item -ItemType Directory -Force dist\ORPHEUS | Out-Null
          Copy-Item -Recurse "build\Orpheus_artefacts\Release\VST3\ORPHEUS.vst3" "dist\ORPHEUS\"
          Copy-Item "build\Orpheus_artefacts\Release\Standalone\ORPHEUS.exe" "dist\ORPHEUS\"
          Copy-Item orpheus\README.md, test.log "dist\ORPHEUS\"
          New-Item -ItemType Directory -Force dist\ORPHEUS\sounds | Out-Null
          Copy-Item test-out\01-default.wav, test-out\05-midi.wav "dist\ORPHEUS\sounds\"
          echo "ORPH_VERSION=$v" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ORPHEUS-${{ env.ORPH_VERSION }}-Windows
          path: dist/ORPHEUS
