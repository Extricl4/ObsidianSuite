# Builds the Obsidian Amp Suite plugin for Windows on every change to plugin/ or ui/,
# runs its self-test, and uploads the VST3, the standalone app and an installer.
# Download them from the run's "Artifacts" box (Actions tab), or let the app update itself:
# every build on main is also published as a release "build-<n>" (Settings > About > UPDATE).
# Push a tag like v0.2.0 to publish them as a GitHub release.
name: Plugin (Windows)

on:
  push:
    branches: [ main ]
    paths: [ 'plugin/**', 'ui/**', '.github/workflows/plugin.yml' ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: WebView2 SDK (for the UI)
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.1901.177 -OutputDirectory "$env:RUNNER_TEMP\nuget" -NonInteractive

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('plugin/cmake/Dependencies.cmake') }}

      # Each step keeps its log; if it fails, the end of the log is shown as an error note on the run page.
      - name: Configure
        shell: pwsh
        run: |
          cmake -S plugin -B build -A x64 -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$env:RUNNER_TEMP\nuget" *>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { ./plugin/tools/ci-report.ps1 configure.log; exit 1 }

      - name: Build VST3 + standalone
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel --target ObsidianSuite_VST3 ObsidianSuite_Standalone -- /v:minimal /clp:ErrorsOnly *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { ./plugin/tools/ci-report.ps1 build.log; exit 1 }

      - name: Self-test
        shell: pwsh
        run: |
          $exe = "build\ObsidianSuite_artefacts\Release\Standalone\Obsidian Amp Suite.exe"
          # install the pedal + amp pack where the plugin looks for it, so --packs plays every capture, IR and capture amp
          $docs = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'Obsidian Amp Suite'
          New-Item -ItemType Directory -Force $docs | Out-Null
          Copy-Item -Recurse -Force plugin\Content\Captures, plugin\Content\IRs, plugin\Content\Amps, plugin\Content\Cabs, plugin\Content\Faces $docs
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest','selftest.txt','--packs' -Wait -PassThru -NoNewWindow
          if (Test-Path selftest.txt) { Get-Content selftest.txt }
          elseif (Test-Path selftest-progress.txt) { Write-Host "--- the self-test stopped early (exit code $('0x{0:X8}' -f $p.ExitCode)); it got this far:"; Get-Content selftest-progress.txt | Select-Object -Last 40 }
          if ($p.ExitCode -ne 0) { if (Test-Path selftest.txt) { ./plugin/tools/ci-report.ps1 selftest.txt } ; exit 1 }

      - name: Package
        shell: pwsh
        run: |
          $v = (Get-Content plugin\VERSION).Trim()
          New-Item -ItemType Directory -Force dist\ObsidianAmpSuite | Out-Null
          Copy-Item -Recurse "build\ObsidianSuite_artefacts\Release\VST3\Obsidian Amp Suite.vst3" "dist\ObsidianAmpSuite\"
          Copy-Item "build\ObsidianSuite_artefacts\Release\Standalone\Obsidian Amp Suite.exe" "dist\ObsidianAmpSuite\"
          Copy-Item plugin\README.md, plugin\LICENSES.md, selftest.txt "dist\ObsidianAmpSuite\"
          New-Item -ItemType Directory -Force dist\ObsidianAmpSuite\Content | Out-Null
          Copy-Item -Recurse plugin\Content\Captures, plugin\Content\IRs, plugin\Content\Amps, plugin\Content\Cabs, plugin\Content\Faces, plugin\Content\README.md "dist\ObsidianAmpSuite\Content\"
          Compress-Archive -Path dist\ObsidianAmpSuite\* -DestinationPath "dist\ObsidianAmpSuite-$v-Windows.zip" -Force
          echo "OBS_VERSION=$v" >> $env:GITHUB_ENV

      - name: Installer
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress | Out-Null; $env:Path += ";C:\Program Files (x86)\Inno Setup 6" }
          iscc /DAppVersion=$env:OBS_VERSION /DBuild=$env:GITHUB_RUN_NUMBER /DSourceDir="$pwd\dist\ObsidianAmpSuite" /O"$pwd\dist" plugin\installer\ObsidianSuite.iss
          # the small one for the app's UPDATE button (no capture / IR pack)
          iscc /DAppVersion=$env:OBS_VERSION /DBuild=$env:GITHUB_RUN_NUMBER /DUpdateOnly=1 /DSourceDir="$pwd\dist\ObsidianAmpSuite" /O"$pwd\dist" plugin\installer\ObsidianSuite.iss

      - uses: actions/upload-artifact@v4
        with:
          name: ObsidianAmpSuite-${{ env.OBS_VERSION }}-Windows
          path: |
            dist/*.zip
            dist/*.exe

      # Every build on main becomes a release "build-<n>": the app's Settings > About > UPDATE finds it there.
      # The notes end with a hidden block the app reads (build, pack, SHA-256 of each installer).
      - name: Publish build (in-app updates)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:OBS_VERSION; $n = $env:GITHUB_RUN_NUMBER
          $setup = Get-ChildItem dist\*-Setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $upd = Get-ChildItem dist\*-Update.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) { Write-Host "::error::No installer was built (see the Installer step): nothing was published for UPDATE"; exit 1 }
          $pack = (Get-Content build\obsidian-pack.txt -Raw).Trim()
          $msg = (git log -1 --pretty=%B) | Where-Object { $_ -notmatch '^(Co-Authored-By|Claude-Session):' }
          $lines = @()
          $lines += $msg
          $lines += ''
          $lines += '<!-- obsidian'
          $lines += "build: $n"
          $lines += "version: $v"
          $lines += "pack: $pack"
          $lines += "sha256: $($setup.Name) $((Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower())"
          if ($upd) { $lines += "sha256: $($upd.Name) $((Get-FileHash $upd.FullName -Algorithm SHA256).Hash.ToLower())" }
          $lines += '-->'
          ($lines -join "`n") | Set-Content -Encoding utf8 notes.md
          $files = @($setup.FullName); if ($upd) { $files += $upd.FullName }
          gh release create "build-$n" @files --title "Build $n ($v)" --notes-file notes.md --target $env:GITHUB_SHA --latest
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # keep the newest 8 builds
          $old = gh release list --limit 100 --json tagName,createdAt | ConvertFrom-Json | Where-Object { $_.tagName -like 'build-*' } | Sort-Object createdAt -Descending | Select-Object -Skip 8
          foreach ($r in $old) { gh release delete $r.tagName --cleanup-tag --yes }

      # not "latest": older builds' UPDATE button reads GitHub's latest release and needs a build-<n> one
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          make_latest: false
          files: |
            dist/*.zip
            dist/*.exe
